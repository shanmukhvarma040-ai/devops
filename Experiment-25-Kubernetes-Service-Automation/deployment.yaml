apiVersion: apps/v1
kind: Deployment
metadata:
  name: myweb
spec:
  replicas: 1
  selector:
    matchLabels:
      app: myweb
  template:
    metadata:
      labels:
        app: myweb
    spec:
      containers:
      - name: mywebcontainer
        image: myweb
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
